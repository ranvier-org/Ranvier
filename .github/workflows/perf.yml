name: Perf

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

permissions:
  contents: read
  actions: read

# Every measured master push must reach history, so each push run has a group of its own. A newer push or label event on
# a pull request cancels that pull request's running measurement.
concurrency:
  group: perf-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.previous.outputs.run }}
      ignored: ${{ steps.ignore.outputs.ignored }}
      docs: ${{ steps.changes.outputs.docs }}
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: refs
        env:
          EVENT: ${{ github.event_name }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET: ${{ github.base_ref }}
        shell: bash
        run: |
          [[ "$HEAD" =~ ^[0-9a-f]{40}$ ]]
          if [ "$EVENT" = pull_request ]; then
            [ "$TARGET" = master ]
            base=$(git merge-base "origin/$TARGET" "$HEAD")
          else
            base=$(git rev-parse "$HEAD^1")
          fi
          [[ "$base" =~ ^[0-9a-f]{40}$ ]]
          printf 'head=%s\nbase=%s\n' "$HEAD" "$base" >> "$GITHUB_OUTPUT"
      # A `Perf-Ignore: <reason>` footer keeps a master commit out of the performance history.
      - id: ignore
        if: github.event_name == 'push'
        uses: actions/github-script@v9
        with:
          script: |
            const {ignoreReason} = require('./.github/scripts/perf-ignore.cjs');
            const reason = ignoreReason(context.payload.head_commit?.message);
            if (reason !== null) core.notice(`Perf-Ignore: ${reason}. This commit is not measured or recorded.`);
            core.setOutput('ignored', String(reason !== null));
      # Pull requests and master commits changing only documentation are not measured. Perf report adds no history
      # record for such a master commit and still deploys its docs.
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ steps.refs.outputs.base }}
          HEAD: ${{ steps.refs.outputs.head }}
        run: node .github/scripts/changes.cjs "$EVENT" "$BASE" "$HEAD" >> "$GITHUB_OUTPUT"
      # A completed run that measured the same base and head trees, such as the pull request of a commit now on
      # master, supplies the measurement.
      - id: previous
        if: steps.ignore.outputs.ignored != 'true' && steps.changes.outputs.docs != 'true'
        uses: actions/github-script@v9
        env:
          HEAD: ${{ steps.refs.outputs.head }}
          BASE: ${{ steps.refs.outputs.base }}
        with:
          script: |
            const {find} = require('./.github/scripts/perf-reuse.cjs');
            const found = await find({github, repo: context.repo, head: process.env.HEAD, base: process.env.BASE, currentRun: context.runId});
            if (found) core.notice(`Reusing the measurement of run ${found.run} (${found.head} against ${found.base}).`);
            core.setOutput('run', found?.run ?? '');

  measure:
    needs: find
    if: needs.find.outputs.run == '' && needs.find.outputs.ignored != 'true' && needs.find.outputs.docs != 'true'
    strategy:
      fail-fast: false
      # Each job measures one runtime of a leg, base and head alternating on one machine; the verdict job merges a leg's
      # jobs into ab-<leg>.json. The primary job of a leg runs the test suites and stores the leg's builds.
      matrix:
        include:
          - leg: arm64-counters
            os: ubuntu-24.04-arm
            runtime: node
            primary: false
          - leg: arm64-counters
            os: ubuntu-24.04-arm
            runtime: node-jitless
            primary: false
          - leg: arm64-counters
            os: ubuntu-24.04-arm
            runtime: dotnet
            primary: true
          - leg: x64-timing
            os: ubuntu-latest
            runtime: node
            primary: false
          - leg: x64-timing
            os: ubuntu-latest
            runtime: dotnet
            primary: true
    name: measure (${{ matrix.leg }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BASE: ${{ needs.find.outputs.base }}
      HEAD: ${{ needs.find.outputs.head }}
      LEG: ${{ matrix.leg }}
      RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.find.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: sudo sysctl -w kernel.perf_event_paranoid=-1
      - name: Full counter suite
        if: matrix.primary
        run: dotnet test bench/Ranvier.Counters.Tests -c Release
      - name: Workflow logic tests
        if: matrix.primary
        run: node --test .github/scripts/*.test.cjs
      # A perf build is keyed by its commit, the build logic and the installed SDKs, which global.json rolls forward
      # over. The measurement reads its workers, Fable output and versions.json, and the cache holds those without the
      # source worktree. A pull request's base is the head build of a master run, or the base build of the pull
      # request's previous run.
      - id: build-key
        run: echo "suffix=$(dotnet --list-sdks | sha256sum | cut -c1-16)-${{ hashFiles('build.fsx', 'global.json') }}" >> "$GITHUB_OUTPUT"
      - id: base-build
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ runner.temp }}/perf/base
            !${{ runner.temp }}/perf/base/src
          key: perf-build-${{ runner.os }}-${{ runner.arch }}-${{ env.BASE }}-${{ steps.build-key.outputs.suffix }}
      - if: steps.base-build.outputs.cache-hit != 'true'
        run: dotnet fsi build.fsx -- perf build "$BASE" "$RUNNER_TEMP/perf/base"
      - if: steps.base-build.outputs.cache-hit != 'true' && github.event_name == 'pull_request' && matrix.primary
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/perf/base
            !${{ runner.temp }}/perf/base/src
          key: ${{ steps.base-build.outputs.cache-primary-key }}
      - run: dotnet fsi build.fsx -- perf build "$HEAD" "$RUNNER_TEMP/perf/head"
      - name: Alternating measurements (arm64 asserts hardware in every region)
        run: dotnet fsi build.fsx -- perf ab "$LEG" "$BASE" "$RUNNER_TEMP/perf/base" "$HEAD" "$RUNNER_TEMP/perf/head" "out/ab-$LEG-$RUNTIME.json" --runtime "$RUNTIME"
      - uses: actions/upload-artifact@v7
        with:
          name: ab-${{ matrix.leg }}-${{ matrix.runtime }}
          path: out/ab-${{ matrix.leg }}-${{ matrix.runtime }}.json
          if-no-files-found: error
      # The verdict job runs on x64 and compares with the head worker this leg built.
      - if: matrix.leg == 'x64-timing' && matrix.primary
        uses: actions/upload-artifact@v7
        with:
          name: head-worker
          path: ${{ runner.temp }}/perf/head/worker
          retention-days: 1
          if-no-files-found: error
      # A master commit is the base of the pull requests opened on it. The cache restores to the base directory, so the
      # head build moves there first.
      - name: Store the head build as a future base
        if: github.event_name == 'push' && matrix.primary
        run: |
          rm -rf "$RUNNER_TEMP/perf/base"
          mv "$RUNNER_TEMP/perf/head" "$RUNNER_TEMP/perf/base"
      - if: github.event_name == 'push' && matrix.primary
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ runner.temp }}/perf/base
            !${{ runner.temp }}/perf/base/src
          key: perf-build-${{ runner.os }}-${{ runner.arch }}-${{ env.HEAD }}-${{ steps.build-key.outputs.suffix }}

  verdict:
    needs: [find, measure]
    if: always() && needs.find.result == 'success' && needs.find.outputs.ignored != 'true' && needs.find.outputs.docs != 'true' && (needs.measure.result == 'success' || needs.measure.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      BASE: ${{ needs.find.outputs.base }}
      HEAD: ${{ needs.find.outputs.head }}
      ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'perf-accepted') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.find.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          pattern: ab-*
          merge-multiple: true
          path: out
          run-id: ${{ needs.find.outputs.run || github.run_id }}
          github-token: ${{ github.token }}
      # A run that measured one runtime per job holds ab-<leg>-<runtime>.json files; a run from before holds ab-<leg>.json.
      - name: Merge each leg's runtime measurements
        run: node .github/scripts/perf-merge.cjs out
      - name: Restate a reused measurement for this base and head
        if: needs.find.outputs.run != ''
        env:
          RUN: ${{ needs.find.outputs.run }}
        run: node .github/scripts/perf-reuse.cjs out "$BASE" "$HEAD" "$RUN"
      # Perf-reuse finds a run's measurement by these two names.
      - uses: actions/upload-artifact@v7
        with:
          name: ab-arm64-counters
          path: out/ab-arm64-counters.json
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v7
        with:
          name: ab-x64-timing
          path: out/ab-x64-timing.json
          if-no-files-found: error
          overwrite: true
      - id: head-worker
        if: needs.measure.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: head-worker
          path: out/head/worker
      - if: steps.head-worker.outcome != 'success'
        run: dotnet build bench/Ranvier.Counters -c Release -p:RanvierTrace=false -p:RanvierCounters=false -o out/head/worker
      - name: Compare and annotate
        run: dotnet fsi build.fsx -- perf compare "$BASE" "$HEAD" "$ACCEPTED" out/report out/ab-arm64-counters.json out/ab-x64-timing.json
      - name: Bind report to this run
        if: always()
        uses: actions/github-script@v9
        env:
          PR: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('node:fs');
            if (!fs.existsSync('out/report/verdict.json') || !fs.existsSync('out/report/comment.md')) throw new Error('No complete fresh verdict');
            fs.writeFileSync('out/report/provenance.json', JSON.stringify({run: String(context.runId), repository: process.env.GITHUB_REPOSITORY, event: context.eventName, pr: process.env.PR, base: process.env.BASE, head: process.env.HEAD}));
            for (const leg of ['arm64-counters', 'x64-timing']) fs.copyFileSync(`out/ab-${leg}.json`, `out/report/ab-${leg}.json`);
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-report
          path: out/report
          if-no-files-found: error

  # The Perf check that branch rules require: a skipped verdict passes only when nothing failed before it.
  result:
    name: Perf result
    needs: [find, measure, verdict]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
