name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# These steps run the operations provided by the build CLI directly.
# Partas.Build 0.8.2 also supports redirected output and automatic GitHub stage summaries.

jobs:
  # Documentation-only changes (see .github/scripts/changes.cjs) skip the build and test jobs; formatting always runs.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/changes.cjs "$EVENT" "$FROM" "$TO" >> "$GITHUB_OUTPUT"

  scripts:
    name: Workflow scripts
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.cjs

  # Each .NET test job builds the core in one flavour, untraced or traced. The two flavours share bin and obj, and a
  # switch between them recompiles every project.
  dotnet:
    name: .NET tests
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The test projects target net10.0, and global.json pins the SDK.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test Ranvier.Tests
        run: dotnet test tests/Ranvier.Tests -c Release
      - name: Test Ranvier.CSharp.Tests
        run: dotnet test tests/Ranvier.CSharp.Tests -c Release
      - name: Test Ranvier.Wire.Tests
        run: dotnet test tests/Ranvier.Wire.Tests -c Release
      - name: Test shared mutation observation
        run: dotnet run --project tests/MutationObservation/Shared.fsproj -c Release
      # The vendored Thoth.Json files must equal the pinned upstream commit plus src/Ranvier.Wire/Vendor/Thoth.Json/patches.
      - name: Check the vendored Thoth.Json
        shell: pwsh
        run: ./src/Ranvier.Wire/Vendor/Thoth.Json/refresh.ps1 -Check

  dotnet-traced:
    name: .NET tests, traced
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The trace log and its queries compile in only with RanvierTrace, and their tests with them.
      - name: Test Ranvier.Tests, traced
        run: dotnet test tests/Ranvier.Tests -c Release -p:RanvierTrace=true
      # The signal maps compile the view projects of a Ranvier.View checkout and the bindings of a Ranvier.Anime checkout against this core.
      - name: Check out Ranvier.View beside the repository
        run: .github/scripts/view-sibling.sh
      # The signal map model reads the trace log, so its tests compile only in a traced build.
      - name: Test Ranvier.Docs.Maps.Tests, traced
        run: dotnet test docs/maps/tests -c Release -p:RanvierTrace=true

  # Packs the five core libraries untraced and traced, then builds and runs a net8.0 consumer of the netstandard2.1
  # packages (which needs the .NET 8 runtime) and compiles and runs the Fable tests against the packages' Fable sources.
  package-consumers:
    name: Package consumers
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
      - name: Check package compatibility
        shell: pwsh
        run: ./tests/check-package-compatibility.ps1 -CheckFable

  # A NativeAOT publish over the library assemblies, Ranvier.Wire included, rooted: any IL2xxx/IL3xxx warning fails
  # the publish, and the binary exits non-zero when an exception or a ToString text differs from the expected text,
  # with tracing on and off.
  aot:
    name: NativeAOT smoke (trace=${{ matrix.trace }})
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        trace: [false, true]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish
        run: dotnet publish tests/Ranvier.AotSmoke -c Release -r linux-x64 -p:RanvierTrace=${{ matrix.trace }} -o artifacts/aot
      - name: Run
        run: ./artifacts/aot/Ranvier.AotSmoke

  # The publish command's release pipeline with the push replaced by a listing: builds, packs every source project
  # untraced and traced, then checks each package's id, version, lib frameworks and trace build. The two .NET test jobs
  # run the suites, so --skip-tests leaves them out here.
  packages:
    name: Packages
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The solution restore includes the signal maps, which reference a Ranvier.View checkout's view projects.
      - name: Check out Ranvier.View beside the repository
        run: .github/scripts/view-sibling.sh
      - name: Pack and dry-publish
        run: dotnet fsi build.fsx -- publish --dry-publish --skip-tests
      - name: Check the packages
        run: node .github/scripts/packages.cjs bin src
      - name: Check shared DOM package consumers
        run: node .github/scripts/dom-package-consumer.cjs bin
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: bin/*.nupkg
          if-no-files-found: error

  format:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore tools
        run: dotnet tool restore
      # Tracked F# sources only: `build.fsx --dry-format` also globs untracked output such as dist/.
      - name: Check formatting
        run: dotnet fantomas --check $(git ls-files '*.fs' ':(exclude)src/Ranvier.Wire/Vendor/**')

  # Every page under docs/content is in a Theme.menu of docs/Site.fs (docs/MenuCoverage.fs). Runs on
  # documentation-only changes too: the site itself builds only after a merge, in docs.yml.
  docs-menus:
    name: Docs menu coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check every docs page is in a menu
        run: dotnet run --project docs/docs.fsproj -- check-menus

  fable:
    name: Fable tests
    needs: changes
    if: needs.changes.outputs.docs != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install npm packages
        run: npm ci
      - name: Restore tools
        run: dotnet tool restore
      - name: Compile the tests
        run: dotnet fickl fable/Ranvier.Tests.Fable -e .fs.js -o dist/tests -c Release
      - name: Compile the traced tests
        run: dotnet fickl fable/Ranvier.Tests.Fable -e .fs.js -o dist/tests-traced -c Release
        env:
          RanvierTrace: 'true'
      - name: Run the tests and report
        run: node fable/Ranvier.Tests.Fable/Report.mjs
      - name: Compile browser mutation observation
        run: dotnet fickl tests/MutationObservation/Browser.fsproj -c Release --noCache -o artifacts/mutation-browser
      - name: Install browser mutation fixture dependencies
        run: npm ci --prefix tests/MutationObservation
      - name: Install Chromium
        run: npx --prefix tests/MutationObservation playwright install --with-deps chromium
      - name: Test browser mutation observation
        run: node tests/MutationObservation/run-browser.mjs artifacts/mutation-browser

  # The fickl release in .config/dotnet-tools.json carries the browser compiler the docs live editor runs. Runs on
  # documentation-only changes too: the docs build only after a merge, so a roll that lacks it fails here first.
  fickl-archives:
    name: Fickl browser compiler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check the release carries both archives
        run: node .github/scripts/fickl-archives.cjs

  # The one CI check that branch rules require: it fails when any job failed or was cancelled, and passes when the
  # build and test jobs were skipped for a documentation-only change.
  result:
    name: CI result
    needs: [changes, scripts, dotnet, dotnet-traced, package-consumers, aot, packages, format, docs-menus, fable, fickl-archives]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
