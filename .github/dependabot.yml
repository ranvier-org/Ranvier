version: 2
# Declared so Dependabot's proxy allows these hosts: a feed named only in nuget.config is blocked.
registries:
  partas-build:
    type: nuget-feed
    url: https://nuget.cloudsmith.io/shayanhabibi/shayanhabibi-partas-build/v3/index.json
  xantham-cloudsmith:
    type: nuget-feed
    url: https://nuget.cloudsmith.io/shayanhabibi/xantham/v3/index.json

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/bench/Ranvier.CoreListBench"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      npm-security-updates:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: "/"
    registries:
      - partas-build
      - xantham-cloudsmith
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      nuget-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      nuget-security-updates:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "FSharp.Core"
      - dependency-name: "Fable*"
      - dependency-name: "fable"
      # Rolled daily by the entry below.
      - dependency-name: "Fickl"
      - dependency-name: "Xantham.*"
      # Local-feed builds committed under docs/feed.
      - dependency-name: "Partas.Solid"
      - dependency-name: "Partas.Nacara.Plugins.Solid"
      - dependency-name: "Nacara.Plugin.LiveExample"

  # Fickl alone, daily, so the tool manifest always names the latest release. Blocks for one branch may not share a
  # directory, so this one starts in /.config: Dependabot finds .config/dotnet-tools.json from there by walking up
  # to the repository root, and finds no project files.
  - package-ecosystem: nuget
    directory: "/.config"
    registries:
      - partas-build
      - xantham-cloudsmith
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    allow:
      - dependency-name: "fickl"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns: ["*"]
      actions-security-updates:
        applies-to: security-updates
        patterns: ["*"]
